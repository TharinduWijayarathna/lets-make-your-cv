<div class="cv-page">
  <aside class="sidebar">
    <div>
      <div class="sidebar-photo-wrap cv-photo-slot" id="cv-photo"><span class="photo-placeholder">👤</span></div>
      <div class="sidebar-name" id="cv-name"></div>
      <div class="sidebar-title" id="cv-title"></div>
    </div>
    <div>
      <div class="sidebar-section-title">Contact</div>
      <ul class="contact-list">
        <li><span class="label">Email</span><span id="cv-email"></span></li>
        <li><span class="label">Phone</span><span id="cv-phone"></span></li>
        <li><span class="label">Location</span><span id="cv-location"></span></li>
        <li><span class="label">LinkedIn</span><span id="cv-linkedin"></span></li>
        <li><span class="label">GitHub</span><span id="cv-github"></span></li>
        <li><span class="label">Portfolio</span><span id="cv-portfolio"></span></li>
      </ul>
    </div>
    <div>
      <div class="sidebar-section-title">Technical Skills</div>
      <div class="tags-wrap" id="cv-tech-tags"></div>
    </div>
    <div>
      <div class="sidebar-section-title">Core Competencies</div>
      <div class="skills-grid" id="cv-skills-bars"></div>
    </div>
    <div>
      <div class="sidebar-section-title">Languages</div>
      <ul class="lang-list" id="cv-languages"></ul>
    </div>
  </aside>
  <main class="main">
    <div class="section">
      <div class="section-title">Professional Summary</div>
      <p class="summary-text" id="cv-summary"></p>
    </div>
    <div class="section">
      <div class="section-title">Work Experience</div>
      <div id="cv-experience"></div>
    </div>
    <div class="section">
      <div class="section-title">Key Projects</div>
      <div id="cv-projects"></div>
    </div>
    <div class="section">
      <div class="section-title">Education</div>
      <div id="cv-education"></div>
    </div>
    <div class="section">
      <div class="section-title">Certifications</div>
      <ul class="cert-list" id="cv-certifications"></ul>
    </div>
  </main>
</div>
