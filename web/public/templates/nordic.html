<div class="cv-page">
  <div class="cv-header">
    <div>
      <div class="cv-header-name" id="cv-name"></div>
      <div class="cv-header-role" id="cv-title"></div>
    </div>
    <div class="cv-header-contact">
      <div id="cv-email"></div>
      <div id="cv-phone"></div>
      <div id="cv-location"></div>
      <div id="cv-linkedin"></div>
      <div id="cv-github"></div>
      <div id="cv-portfolio"></div>
    </div>
  </div>
  <div class="cv-body">
    <div class="cv-col">
      <div class="section">
        <div class="sec-label">Profile</div>
        <p class="summary-p" id="cv-summary"></p>
      </div>
      <div class="section">
        <div class="sec-label">Experience</div>
        <div id="cv-experience"></div>
      </div>
      <div class="section">
        <div class="sec-label">Education</div>
        <div id="cv-education"></div>
      </div>
    </div>
    <div class="cv-col-divider"></div>
    <div class="cv-col">
      <div class="section">
        <div class="sec-label">Core Competencies</div>
        <div id="cv-skills-dots"></div>
      </div>
      <div class="section">
        <div class="sec-label">Technologies</div>
        <div class="tag-wrap" id="cv-tech-tags"></div>
      </div>
      <div class="section">
        <div class="sec-label">Key Projects</div>
        <div id="cv-projects"></div>
      </div>
      <div class="section">
        <div class="sec-label">Certifications</div>
        <div id="cv-certifications"></div>
      </div>
    </div>
  </div>
</div>
