<div class="cv-page">
  <header class="mast">
    <div class="name-wrap">
      <div class="kicker">Professional Portfolio CV</div>
      <h1 id="cv-name"></h1>
      <div id="cv-title"></div>
    </div>
    <div class="contact-card">
      <div id="cv-email"></div>
      <div id="cv-phone"></div>
      <div id="cv-location"></div>
      <div id="cv-linkedin"></div>
    </div>
  </header>
  <div class="grid">
    <aside>
      <div class="side-panel"><div class="section-title">Skills</div><div class="skill-wrap" id="cv-skills"></div></div>
      <div class="side-panel"><div class="section-title">Education</div><div id="cv-education"></div></div>
      <div class="side-panel"><div class="section-title">Certifications</div><div id="cv-certifications"></div></div>
      <div class="side-panel"><div class="section-title">Languages</div><div id="cv-languages"></div></div>
    </aside>
    <main>
      <section class="section"><div class="section-title">Summary</div><p class="summary" id="cv-summary"></p></section>
      <section class="section"><div class="section-title">Experience</div><div id="cv-experience"></div></section>
      <section class="section"><div class="section-title">Projects</div><div id="cv-projects"></div></section>
    </main>
  </div>
</div>
