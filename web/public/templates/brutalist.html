<div class="cv-page">
  <div class="cv-header">
    <div class="header-left">
      <div class="header-no">CV // RESUME</div>
      <div class="header-name" id="cv-name"></div>
      <div class="header-role" id="cv-title"></div>
    </div>
    <div class="header-right">
      <div class="contact-item"><span class="cl">Email</span><span id="cv-email"></span></div>
      <div class="contact-item"><span class="cl">Phone</span><span id="cv-phone"></span></div>
      <div class="contact-item"><span class="cl">City</span><span id="cv-location"></span></div>
      <div class="contact-item"><span class="cl">GitHub</span><span id="cv-github"></span></div>
      <div class="contact-item"><span class="cl">LinkedIn</span><span id="cv-linkedin"></span></div>
      <div class="contact-item"><span class="cl">Portfolio</span><span id="cv-portfolio"></span></div>
    </div>
  </div>

  <div class="cv-body">
    <div class="col-left">
      <div class="left-block">
        <div class="sec-label">Skills</div>
        <ul class="skill-mono" id="cv-skills"></ul>
      </div>
      <div class="left-block">
        <div class="sec-label">Tools</div>
        <div class="tag-row" id="cv-tech-tags"></div>
      </div>
      <div class="left-block">
        <div class="sec-label">Education</div>
        <div id="cv-education"></div>
      </div>
      <div class="left-block">
        <div class="sec-label">Certs</div>
        <div id="cv-certifications"></div>
      </div>
      <div class="left-block">
        <div class="sec-label">Lang</div>
        <div id="cv-languages"></div>
      </div>
    </div>

    <div class="col-right">
      <div class="right-block">
        <div class="sec-label">Profile</div>
        <p class="summary-txt" id="cv-summary"></p>
      </div>
      <div class="right-block">
        <div class="sec-label">Experience</div>
        <div id="cv-experience"></div>
      </div>
      <div class="right-block">
        <div class="sec-label">Projects</div>
        <div class="proj-grid" id="cv-projects"></div>
      </div>
    </div>
  </div>
</div>
