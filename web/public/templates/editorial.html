<div class="cv-page">
  <div class="cv-hero">
    <div class="hero-eyebrow">Curriculum Vitae</div>
    <div class="hero-name" id="cv-name-wrap"></div>
    <div class="hero-tagline" id="cv-tagline"></div>
    <div class="hero-meta">
      <div class="hero-meta-item"><strong>Email</strong><span id="cv-email"></span></div>
      <div class="hero-meta-item"><strong>Phone</strong><span id="cv-phone"></span></div>
      <div class="hero-meta-item"><strong>Location</strong><span id="cv-location"></span></div>
      <div class="hero-meta-item"><strong>LinkedIn</strong><span id="cv-linkedin"></span></div>
      <div class="hero-meta-item"><strong>GitHub</strong><span id="cv-github"></span></div>
      <div class="hero-meta-item"><strong>Portfolio</strong><span id="cv-portfolio"></span></div>
    </div>
  </div>
  <div class="cv-body">
    <div class="cv-left">
      <div class="section">
        <div class="sec-head">Core Skills</div>
        <div id="cv-skill-bars"></div>
      </div>
      <div class="section">
        <div class="sec-head">Technologies</div>
        <div class="tag-cloud" id="cv-tech-tags"></div>
      </div>
      <div class="section">
        <div class="sec-head">Languages</div>
        <div id="cv-languages"></div>
      </div>
      <div class="section">
        <div class="sec-head">Certifications</div>
        <div id="cv-certifications"></div>
      </div>
    </div>
    <div class="cv-divider"></div>
    <div class="cv-right">
      <div class="section">
        <div class="sec-head">Profile</div>
        <p style="font-size:10.5px;line-height:1.8;color:var(--mid);font-weight:300" id="cv-summary"></p>
      </div>
      <div class="section">
        <div class="sec-head">Experience</div>
        <div id="cv-experience"></div>
      </div>
      <div class="section">
        <div class="sec-head">Projects</div>
        <div id="cv-projects"></div>
      </div>
      <div class="section">
        <div class="sec-head">Education</div>
        <div id="cv-education"></div>
      </div>
    </div>
  </div>
</div>
