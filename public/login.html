<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Build Your CV</title>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/landing.css" />
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body class="auth-page">

<header class="landing-header">
  <a href="/" class="landing-logo">Build Your CV</a>
  <nav class="landing-nav" id="landing-nav-auth" aria-label="Account"></nav>
</header>

<main class="auth-main">
  <div class="auth-card">
    <h1>Welcome back</h1>
    <p class="auth-subtitle">Sign in to edit and save your CV online — free, anytime.</p>
    <div id="auth-error" class="auth-error" role="alert"></div>
    <form id="auth-form" class="auth-form" data-endpoint="/api/auth/login" novalidate>
      <div class="field-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required />
      </div>
      <div class="field-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required minlength="8" />
      </div>
      <button type="submit" class="btn btn-primary auth-submit" data-label="Sign in" data-loading="Signing in…">Sign in</button>
    </form>
    <p class="auth-footer">No account? <a href="/register.html">Create one free</a></p>
  </div>
</main>

<script src="/js/auth-client.js"></script>
<script src="/js/auth-page.js"></script>
</body>
</html>
