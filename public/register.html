<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create account — Let's Make Your CV</title>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/landing.css" />
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body class="auth-page">

<header class="landing-header">
  <a href="/" class="landing-logo">Let's Make Your CV</a>
  <nav class="landing-nav" id="landing-nav-auth" aria-label="Account"></nav>
</header>

<main class="auth-main">
  <div class="auth-card">
    <h1>Create your free account</h1>
    <p class="auth-subtitle">Make a professional CV in minutes. Your data is saved securely to your account.</p>
    <div id="auth-error" class="auth-error" role="alert"></div>
    <form id="auth-form" class="auth-form" data-endpoint="/api/auth/register" novalidate>
      <div class="field-group">
        <label for="name">Full name</label>
        <input type="text" id="name" name="name" autocomplete="name" required />
      </div>
      <div class="field-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required />
      </div>
      <div class="field-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="new-password" required minlength="8" />
        <p style="font-size:0.75rem;color:#888;margin-top:6px">At least 8 characters</p>
      </div>
      <button type="submit" class="btn btn-primary auth-submit" data-label="Create account" data-loading="Creating account…">Create account</button>
    </form>
    <p class="auth-footer">Already have an account? <a href="/login.html">Sign in</a></p>
  </div>
</main>

<script src="/js/auth-client.js"></script>
<script src="/js/auth-page.js"></script>
</body>
</html>
