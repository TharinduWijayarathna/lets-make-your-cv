<div class="cv-page">
  <header class="cv-header">
    <div class="header-main">
      <div class="header-kicker">Professional Profile</div>
      <div class="header-name" id="cv-name"></div>
      <div class="header-title" id="cv-title"></div>
    </div>
    <div class="header-contact">
      <div class="contact-row"><span class="contact-label">Email</span><span class="contact-value" id="cv-email"></span></div>
      <div class="contact-row"><span class="contact-label">Phone</span><span class="contact-value" id="cv-phone"></span></div>
      <div class="contact-row"><span class="contact-label">Location</span><span class="contact-value" id="cv-location"></span></div>
      <div class="contact-row"><span class="contact-label">LinkedIn</span><span class="contact-value" id="cv-linkedin"></span></div>
      <div class="contact-row"><span class="contact-label">Portfolio</span><span class="contact-value" id="cv-portfolio"></span></div>
    </div>
  </header>

  <div class="cv-body">
    <aside class="sidebar">
      <section class="section">
        <div class="section-title">Profile</div>
        <p class="profile" id="cv-summary"></p>
      </section>

      <section class="section">
        <div class="section-title">Expertise</div>
        <div id="cv-skill-groups"></div>
      </section>

      <section class="section">
        <div class="section-title">Core Tools</div>
        <div class="badge-wrap" id="cv-tools"></div>
      </section>

      <section class="section">
        <div class="section-title">Education</div>
        <div id="cv-education"></div>
      </section>

      <section class="section">
        <div class="section-title">Certifications</div>
        <div id="cv-certifications"></div>
      </section>

      <section class="section">
        <div class="section-title">Languages</div>
        <div id="cv-languages"></div>
      </section>
    </aside>

    <main class="main">
      <section class="section">
        <div class="section-title">Professional Experience</div>
        <div id="cv-experience"></div>
      </section>

      <section class="section">
        <div class="section-title">Selected Projects</div>
        <div class="project-grid" id="cv-projects"></div>
      </section>

      <section class="section">
        <div class="section-title">Key Achievements</div>
        <ul class="achievement-list" id="cv-achievements"></ul>
      </section>
    </main>
  </div>
</div>
