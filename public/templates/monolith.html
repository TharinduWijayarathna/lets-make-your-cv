<div class="cv-page">
  <header class="hero">
    <div>
      <div class="kicker">Executive Profile</div>
      <h1 id="cv-name"></h1>
      <div id="cv-title"></div>
    </div>
    <div class="contact">
      <div id="cv-email"></div>
      <div id="cv-phone"></div>
      <div id="cv-location"></div>
      <div id="cv-linkedin"></div>
    </div>
  </header>
  <div class="body">
    <aside class="sidebar">
      <section class="section"><div class="section-title">Skills</div><div class="skill-wrap" id="cv-skills"></div></section>
      <section class="section"><div class="section-title">Education</div><div id="cv-education"></div></section>
      <section class="section"><div class="section-title">Certifications</div><div id="cv-certifications"></div></section>
      <section class="section"><div class="section-title">Languages</div><div id="cv-languages"></div></section>
    </aside>
    <main class="main">
      <section class="section"><div class="section-title">Profile</div><p class="summary" id="cv-summary"></p></section>
      <section class="section"><div class="section-title">Experience</div><div id="cv-experience"></div></section>
      <section class="section"><div class="section-title">Projects</div><div id="cv-projects"></div></section>
    </main>
  </div>
</div>
