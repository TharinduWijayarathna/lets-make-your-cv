<div class="cv-page ink-page">
<header class="folio-head">
    <div class="folio-no">Professional Resume</div>
    <h1 id="cv-name"></h1>
    <div class="title" id="cv-title"></div>
    <div class="contact-line">
      <span id="cv-email"></span><i>•</i><span id="cv-phone"></span><i>•</i><span id="cv-location"></span>
      <i>•</i><span id="cv-linkedin"></span><i>•</i><span id="cv-github"></span><i>•</i><span id="cv-portfolio"></span>
    </div>
  </header>
  <section class="summary-panel">
    <h2>Profile</h2>
    <p id="cv-summary"></p>
  </section>
  <section class="ink-columns">
    <div class="wide">
      <section class="block">
        <h2>Experience</h2>
        <div id="cv-experience"></div>
      </section>
      <section class="block">
        <h2>Selected Projects</h2>
        <div id="cv-projects"></div>
      </section>
    </div>
    <aside class="narrow">
      <section class="block">
        <h2>Core Skills</h2>
        <div id="cv-skills"></div>
      </section>
      <section class="block">
        <h2>Toolkit</h2>
        <div class="tags" id="cv-tech-tags"></div>
      </section>
      <section class="block">
        <h2>Education</h2>
        <div id="cv-education"></div>
      </section>
      <section class="block">
        <h2>Certifications</h2>
        <div id="cv-certifications"></div>
      </section>
      <section class="block">
        <h2>Languages</h2>
        <div id="cv-languages"></div>
      </section>
    </aside>
  </section>
</div>
