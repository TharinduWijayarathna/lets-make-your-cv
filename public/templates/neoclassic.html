<div class="cv-page">
  <header class="hero">
    <div class="kicker">Curriculum Vitae</div>
    <h1 id="cv-name"></h1>
    <div id="cv-title"></div>
    <div class="meta">
      <span id="cv-email"></span>
      <span id="cv-phone"></span>
      <span id="cv-location"></span>
      <span id="cv-linkedin"></span>
    </div>
  </header>
  <div class="body">
    <aside class="side">
      <section class="section"><div class="section-title">Expertise</div><div class="skill-wrap" id="cv-skills"></div></section>
      <section class="section"><div class="section-title">Education</div><div id="cv-education"></div></section>
      <section class="section"><div class="section-title">Certifications</div><div id="cv-certifications"></div></section>
      <section class="section"><div class="section-title">Languages</div><div id="cv-languages"></div></section>
    </aside>
    <main class="main">
      <section class="section"><div class="section-title">Profile</div><p class="summary" id="cv-summary"></p></section>
      <section class="section"><div class="section-title">Experience</div><div id="cv-experience"></div></section>
      <section class="section"><div class="section-title">Selected Projects</div><div id="cv-projects"></div></section>
    </main>
  </div>
</div>
