<div class="cv-page">
  <header class="header">
    <div>
      <div class="kicker">Meridian Editorial CV</div>
      <h1 id="cv-name"></h1>
      <div id="cv-title"></div>
    </div>
    <div class="contact">
      <div id="cv-email"></div>
      <div id="cv-phone"></div>
      <div id="cv-location"></div>
      <div id="cv-linkedin"></div>
    </div>
  </header>
  <div class="body">
    <main>
      <section class="section summary-block">
        <div class="section-title">Profile</div>
        <p class="summary" id="cv-summary"></p>
      </section>
      <section class="section">
        <div class="section-title">Experience</div>
        <div id="cv-experience"></div>
      </section>
      <section class="section">
        <div class="section-title">Projects</div>
        <div id="cv-projects"></div>
      </section>
    </main>
    <aside>
      <div class="aside-box section">
        <div class="section-title">Skills</div>
        <div class="skill-wrap" id="cv-skills"></div>
      </div>
      <div class="aside-box section">
        <div class="section-title">Education</div>
        <div id="cv-education"></div>
      </div>
      <div class="aside-box section">
        <div class="section-title">Certifications</div>
        <div id="cv-certifications"></div>
      </div>
      <div class="aside-box section">
        <div class="section-title">Languages</div>
        <div id="cv-languages"></div>
      </div>
    </aside>
  </div>
</div>
