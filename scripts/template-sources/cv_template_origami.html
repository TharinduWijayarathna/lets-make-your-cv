<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>CV – Folded Origami</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=Fraunces:opsz,wght@9..144,500;600;700&display=swap" rel="stylesheet"><style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{display:flex;flex-direction:column;align-items:center;padding:40px 20px;min-height:100vh}
.toolbar{display:flex;gap:10px;margin-bottom:22px;flex-wrap:wrap;align-items:center}
.toolbar button{border:none;cursor:pointer;padding:10px 20px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:10px}
.cv-page{width:210mm;min-height:297mm;overflow:hidden;position:relative}
.section-title{font-size:10px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;margin-bottom:14px}
.summary{font-size:10.5px;line-height:1.85}
.exp ul{list-style:none;display:flex;flex-direction:column;gap:5px}.exp li{font-size:10px;line-height:1.65;position:relative;padding-left:14px}.exp li::before{content:'•';position:absolute;left:0;top:0}
.project p{font-size:9.5px;line-height:1.65}.project-tech{font-size:8px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin:4px 0 6px}
.skill{margin-bottom:10px}.skill-top{display:flex;justify-content:space-between;font-size:9.5px;font-weight:700;margin-bottom:5px}.skill-track{height:5px;border-radius:99px;overflow:hidden}.skill-fill{height:100%;border-radius:99px}.tag-wrap{display:flex;flex-wrap:wrap;gap:5px}.tag{font-size:8.5px;font-weight:700;padding:4px 8px}.lang{display:flex;justify-content:space-between;font-size:9.5px;margin-bottom:7px}.lang strong{font-size:8.5px}.edu,.cert{display:flex;justify-content:space-between;gap:10px;padding:9px 0}.edu h3{font-size:10.5px}.edu p,.cert small{font-size:9px}.cert span{font-size:10px;font-weight:700}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.68);z-index:100;align-items:center;justify-content:center}.modal-overlay.active{display:flex}.modal{width:720px;max-width:96vw;max-height:90vh;overflow:auto;padding:34px}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal h2{font-size:26px}.modal-close{border:none;background:none;font-size:28px;cursor:pointer}.modal-sub{font-size:11px;margin:5px 0 20px}.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}.tab{border:none;cursor:pointer;padding:8px 12px;font-size:10px;text-transform:uppercase;font-weight:800;letter-spacing:.08em}.tp{display:none}.tp.active{display:block}.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fg{margin-bottom:14px}.fg label{display:block;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;margin-bottom:5px}.fg input,.fg textarea{width:100%;padding:10px 12px;font:inherit;font-size:12px}.fg textarea{min-height:76px;resize:vertical}.de{position:relative;padding:14px;margin-bottom:12px}.rm{position:absolute;right:10px;top:8px;border:none;background:none;font-size:18px;cursor:pointer}.add-b,.bc,.ba{cursor:pointer;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.add-b{width:100%;padding:10px;border-style:dashed}.ma{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;padding-top:18px}.bc,.ba{padding:10px 18px;border:none}.mini-title{font-size:12px;margin:6px 0 12px;text-transform:uppercase;letter-spacing:.12em}.mini-title.second{margin-top:20px}
@media print{body{background:none;padding:0}.cv-page{box-shadow:none}.no-print{display:none}}


:root{--paper:#fffaf4;--ink:#252020;--muted:#6a5b54;--line:#e5d8ce;--coral:#e96d5b;--plum:#6f4f73;--sand:#f0dfcf;--sage:#8ca48f}
body{font-family:'DM Sans',sans-serif;background:#e6d7ca;color:var(--ink)}.btn-edit{background:var(--plum);color:#fff;border-radius:6px 22px 6px 22px}.btn-print{background:var(--coral);color:#fff;border-radius:22px 6px 22px 6px}.cv-page{background:var(--paper);box-shadow:0 24px 70px rgba(70,40,30,.22);display:grid;grid-template-columns:76mm 1fr}.fold{background:linear-gradient(160deg,#fbede4,#f3dfd1 52%,#eef2e8);padding:34px 26px;clip-path:polygon(0 0,100% 0,88% 12%,100% 24%,88% 36%,100% 48%,88% 60%,100% 72%,88% 84%,100% 100%,0 100%)}.main{padding:34px 38px 34px 24px}.badge{width:92px;height:92px;background:var(--coral);clip-path:polygon(50% 0,100% 28%,84% 82%,50% 100%,16% 82%,0 28%);display:grid;place-items:center;color:#fff;font-size:28px;margin-bottom:18px}.name{font-family:'Fraunces',serif;font-size:34px;line-height:1.02}.role{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--plum);font-weight:800;margin:10px 0 18px}.contact{font-size:9.5px;line-height:1.85}.contact b{display:block;color:var(--coral);font-size:8px;letter-spacing:.16em;text-transform:uppercase}.summary-card{background:#fff;border:1px solid var(--line);padding:18px 20px;clip-path:polygon(0 0,96% 0,100% 18%,100% 100%,4% 100%,0 82%);margin-bottom:18px}.summary{color:var(--muted)}.section-title{color:var(--plum)}.exp{display:grid;grid-template-columns:84px 1fr;gap:14px;margin-bottom:14px}.exp-year{background:var(--sand);padding:12px 10px;font-size:8.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;clip-path:polygon(0 0,100% 0,90% 100%,0 100%)}.exp-card{border:1px solid var(--line);padding:13px 15px;background:#fff}.exp h3{font-size:12px}.exp-meta{font-size:8.5px;color:var(--coral);font-weight:800;margin:4px 0 8px}.exp li{color:var(--muted)}.exp li::before{content:'◇';color:var(--sage)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.project{background:#fff;border:1px solid var(--line);padding:12px;clip-path:polygon(0 0,100% 0,100% 88%,88% 100%,0 100%);margin-bottom:10px}.project h3{font-size:11px}.project-tech{color:var(--plum)}.project p,.lang,.edu p,.cert small{color:var(--muted)}.skill-track{background:#eadfd8}.skill-fill{background:linear-gradient(90deg,var(--coral),var(--plum))}.tag{background:#fff;border:1px solid var(--line);color:var(--ink)}.edu,.cert,.lang{border-bottom:1px solid var(--line)}.modal{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:28px}.modal-sub,.fg label{color:var(--muted)}.tab,.bc{background:var(--sand);color:var(--ink);border-radius:999px}.tab.active,.ba{background:var(--plum);color:#fff;border-radius:999px}.fg input,.fg textarea,.de{background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:18px}.add-b{background:#fff;color:var(--plum);border-color:var(--plum);border-radius:999px}.ma{border-top:1px solid var(--line)}
</style></head><body><div class="toolbar no-print"><button class="btn-edit" onclick="openModal()">Edit CV</button><button class="btn-print" onclick="window.print()">Print / PDF</button></div><div class="cv-page"><aside class="fold"><div class="badge">✦</div><div class="name" id="cv-name"></div><div class="role" id="cv-title"></div><div class="contact"><b>Email</b><span id="cv-email"></span><b>Phone</b><span id="cv-phone"></span><b>Location</b><span id="cv-location"></span><b>LinkedIn</b><span id="cv-linkedin"></span><b>GitHub</b><span id="cv-github"></span><b>Portfolio</b><span id="cv-portfolio"></span></div><div class="section-title" style="margin-top:20px">Skills</div><div id="cv-skills"></div><div class="section-title" style="margin-top:18px">Languages</div><div id="cv-languages"></div></aside><main class="main"><div class="summary-card"><div class="section-title">Profile Fold</div><p class="summary" id="cv-summary"></p></div><div class="section-title">Experience</div><div id="cv-experience"></div><div class="grid"><section><div class="section-title">Projects</div><div id="cv-projects"></div><div class="section-title" style="margin-top:16px">Tech</div><div class="tag-wrap" id="cv-tech-tags"></div></section><section><div class="section-title">Education</div><div id="cv-education"></div><div class="section-title" style="margin-top:16px">Certifications</div><div id="cv-certifications"></div></section></div></main></div>
<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-head"><h2>Edit CV</h2><button class="modal-close" onclick="closeModal()">×</button></div>
    <p class="modal-sub">Update content, add sections, and print the same layout as PDF.</p>
    <div class="tabs">
      <button class="tab active" onclick="tabTo('tp-profile',this)">Profile</button>
      <button class="tab" onclick="tabTo('tp-skills',this)">Skills</button>
      <button class="tab" onclick="tabTo('tp-exp',this)">Experience</button>
      <button class="tab" onclick="tabTo('tp-projects',this)">Projects</button>
      <button class="tab" onclick="tabTo('tp-more',this)">Education</button>
    </div>
    <div class="tp active" id="tp-profile">
      <div class="fr"><div class="fg"><label>Name</label><input id="f-name"></div><div class="fg"><label>Title</label><input id="f-title"></div></div>
      <div class="fr"><div class="fg"><label>Email</label><input id="f-email"></div><div class="fg"><label>Phone</label><input id="f-phone"></div></div>
      <div class="fr"><div class="fg"><label>Location</label><input id="f-location"></div><div class="fg"><label>LinkedIn</label><input id="f-linkedin"></div></div>
      <div class="fr"><div class="fg"><label>GitHub</label><input id="f-github"></div><div class="fg"><label>Portfolio</label><input id="f-portfolio"></div></div>
      <div class="fg"><label>Summary</label><textarea id="f-summary"></textarea></div>
    </div>
    <div class="tp" id="tp-skills">
      <div class="fg"><label>Skill bars — one per line: Name|Percent</label><textarea id="f-skills"></textarea></div>
      <div class="fg"><label>Tech tags — comma separated</label><textarea id="f-tags"></textarea></div>
      <div class="fg"><label>Languages — one per line: Language|Level</label><textarea id="f-languages"></textarea></div>
    </div>
    <div class="tp" id="tp-exp"><div id="f-exp-entries"></div><button class="add-b" onclick="addExp()">+ Add Experience</button></div>
    <div class="tp" id="tp-projects"><div id="f-proj-entries"></div><button class="add-b" onclick="addProj()">+ Add Project</button></div>
    <div class="tp" id="tp-more">
      <h3 class="mini-title">Education</h3><div id="f-edu-entries"></div><button class="add-b" onclick="addEdu()">+ Add Education</button>
      <h3 class="mini-title second">Certifications</h3><div id="f-cert-entries"></div><button class="add-b" onclick="addCert()">+ Add Certification</button>
    </div>
    <div class="ma"><button class="bc" onclick="closeModal()">Cancel</button><button class="ba" onclick="apply()">Apply Changes</button></div>
  </div>
</div>
<script>
const profile={"name": "Elena Park", "title": "Product Engineer & Systems Thinker", "email": "elena.park@email.com", "phone": "+1 (647) 555 0142", "location": "Toronto, CA", "linkedin": "linkedin.com/in/elenapark", "github": "github.com/elenapark", "portfolio": "elenapark.dev", "summary": "Product-minded engineer who blends software architecture, interface craft, and measurable delivery. Experienced in building web platforms, internal tools, and automation systems that stay maintainable as teams scale."};
let skills=[{"name": "React / Next.js", "pct": 94}, {"name": "TypeScript", "pct": 91}, {"name": "Laravel / APIs", "pct": 86}, {"name": "Data Modeling", "pct": 84}, {"name": "Cloud / DevOps", "pct": 80}, {"name": "UX Systems", "pct": 88}];
let tags=["React", "TypeScript", "Laravel", "PostgreSQL", "AWS", "Docker", "Tailwind", "Playwright"];
let languages=[{"name": "English", "level": "Fluent"}, {"name": "Sinhala", "level": "Native"}, {"name": "French", "level": "Conversational"}];
let exp=[{"role": "Lead Product Engineer", "co": "Vector North \u00b7 Toronto", "from": "2023", "to": "Present", "pts": "Shipped a configurable operations platform adopted by 55+ client teams.\nReduced repetitive support requests by 38% through better self-serve workflows.\nBuilt reusable UI and data patterns that shortened feature delivery cycles by 27%."}, {"role": "Full Stack Engineer", "co": "Studio Relay \u00b7 Remote", "from": "2020", "to": "2023", "pts": "Delivered multi-tenant dashboards, approval flows, and reporting experiences across SaaS products.\nIntroduced background job observability and failure recovery patterns for business-critical processes.\nPartnered with design to improve task completion rates in onboarding and approvals."}, {"role": "Software Developer", "co": "Brightline Labs \u00b7 Colombo", "from": "2018", "to": "2020", "pts": "Built customer portals and admin tooling for service businesses.\nAutomated deployment checks and improved release confidence across web projects."}];
let projects=[{"name": "Pulse Atlas", "tech": "Next.js \u00b7 Charts \u00b7 PostgreSQL", "desc": "Executive metrics board that turns operational streams into concise decision views."}, {"name": "Queue Pilot", "tech": "Laravel \u00b7 Redis \u00b7 Webhooks", "desc": "Workflow orchestration layer for approvals, retries, and visibility across automations."}, {"name": "CV Atelier", "tech": "HTML \u00b7 CSS \u00b7 Export", "desc": "Template-driven CV builder with polished print layouts and editable sections."}];
let education=[{"degree": "BSc in Software Engineering", "school": "University of Moratuwa", "year": "2014 \u2013 2018"}, {"degree": "Product Analytics Certificate", "school": "Professional Learning Track", "year": "2024"}];
let certs=[{"name": "AWS Certified Cloud Practitioner", "issuer": "Amazon Web Services \u00b7 2025"}, {"name": "Scrum Product Ownership Foundations", "issuer": "Agile Institute \u00b7 2023"}];
const e=id=>document.getElementById(id);
const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const lines=s=>String(s||'').split('
').map(v=>v.trim()).filter(Boolean);
function setText(id,value){const el=e(id);if(el)el.textContent=value||'';}
function renderCv(){
  ['name','title','email','phone','location','linkedin','github','portfolio','summary'].forEach(k=>setText('cv-'+k,profile[k]));
  const skill=e('cv-skills'); if(skill) skill.innerHTML=skills.map(s=>`<div class="skill"><div class="skill-top"><span>${esc(s.name)}</span><span>${Number(s.pct)||0}%</span></div><div class="skill-track"><div class="skill-fill" style="width:${Math.max(0,Math.min(100,Number(s.pct)||0))}%"></div></div></div>`).join('');
  const tag=e('cv-tech-tags'); if(tag) tag.innerHTML=tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('');
  const lang=e('cv-languages'); if(lang) lang.innerHTML=languages.map(l=>`<div class="lang"><span>${esc(l.name)}</span><strong>${esc(l.level)}</strong></div>`).join('');
  const ex=e('cv-experience'); if(ex) ex.innerHTML=exp.map((x,i)=>`<article class="exp"><div class="exp-year">${esc(x.from)} — ${esc(x.to)}</div><div class="exp-card"><h3>${esc(x.role)}</h3><div class="exp-meta">${esc(x.co)}</div><ul>${lines(x.pts).map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div></article>`).join('');
  const proj=e('cv-projects'); if(proj) proj.innerHTML=projects.map((p,i)=>`<article class="project"><h3>${esc(p.name)}</h3><div class="project-tech">${esc(p.tech)}</div><p>${esc(p.desc)}</p></article>`).join('');
  const edu=e('cv-education'); if(edu) edu.innerHTML=education.map(d=>`<div class="edu"><div><h3>${esc(d.degree)}</h3><p>${esc(d.school)}</p></div><span>${esc(d.year)}</span></div>`).join('');
  const cert=e('cv-certifications'); if(cert) cert.innerHTML=certs.map(c=>`<div class="cert"><span>${esc(c.name)}</span><small>${esc(c.issuer)}</small></div>`).join('');
}
function openModal(){populateForms();e('modal-overlay').classList.add('active');}
function closeModal(){e('modal-overlay').classList.remove('active');}
function tabTo(id,btn){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.tp').forEach(t=>t.classList.remove('active'));btn.classList.add('active');e(id).classList.add('active');}
function field(label,value){return `<div class="fg"><label>${label}</label><input value="${esc(value)}"></div>`;}
function area(label,value){return `<div class="fg"><label>${label}</label><textarea>${esc(value)}</textarea></div>`;}
function removeEntry(btn){btn.closest('.de').remove();}
function populateForms(){e('f-name').value=profile.name;e('f-title').value=profile.title;e('f-email').value=profile.email;e('f-phone').value=profile.phone;e('f-location').value=profile.location;e('f-linkedin').value=profile.linkedin;e('f-github').value=profile.github;e('f-portfolio').value=profile.portfolio;e('f-summary').value=profile.summary;e('f-tags').value=tags.join(', ');e('f-skills').value=skills.map(s=>`${s.name}|${s.pct}`).join('
');e('f-languages').value=languages.map(l=>`${l.name}|${l.level}`).join('
');renderForms();}
function renderForms(){e('f-exp-entries').innerHTML=exp.map(x=>`<div class="de"><button class="rm" onclick="removeEntry(this)">×</button><div class="fr">${field('Role',x.role)}${field('Company',x.co)}</div><div class="fr">${field('From',x.from)}${field('To',x.to)}</div>${area('Achievements, one per line',x.pts)}</div>`).join('');e('f-proj-entries').innerHTML=projects.map(p=>`<div class="de"><button class="rm" onclick="removeEntry(this)">×</button><div class="fr">${field('Project',p.name)}${field('Tech Stack',p.tech)}</div>${area('Description',p.desc)}</div>`).join('');e('f-edu-entries').innerHTML=education.map(d=>`<div class="de"><button class="rm" onclick="removeEntry(this)">×</button><div class="fr">${field('Degree',d.degree)}${field('Institution',d.school)}</div>${field('Year / Result',d.year)}</div>`).join('');e('f-cert-entries').innerHTML=certs.map(c=>`<div class="de"><button class="rm" onclick="removeEntry(this)">×</button><div class="fr">${field('Certification',c.name)}${field('Issuer / Year',c.issuer)}</div></div>`).join('');}
function addExp(){exp.push({role:'New Role',co:'Company',from:'2025',to:'Present',pts:'Add a measurable achievement.'});renderForms();}
function addProj(){projects.push({name:'New Project',tech:'Tech stack',desc:'Explain the project value.'});renderForms();}
function addEdu(){education.push({degree:'Degree',school:'Institution',year:'Year'});renderForms();}
function addCert(){certs.push({name:'Certification',issuer:'Issuer · Year'});renderForms();}
function vals(root){return [...root.querySelectorAll('input')].map(x=>x.value.trim());}
function apply(){profile.name=e('f-name').value.trim();profile.title=e('f-title').value.trim();profile.email=e('f-email').value.trim();profile.phone=e('f-phone').value.trim();profile.location=e('f-location').value.trim();profile.linkedin=e('f-linkedin').value.trim();profile.github=e('f-github').value.trim();profile.portfolio=e('f-portfolio').value.trim();profile.summary=e('f-summary').value.trim();tags=e('f-tags').value.split(',').map(v=>v.trim()).filter(Boolean);skills=e('f-skills').value.split('
').map(row=>{let [name,pct]=row.split('|').map(v=>(v||'').trim());return name?{name,pct:Math.max(0,Math.min(100,Number(pct)||0))}:null}).filter(Boolean);languages=e('f-languages').value.split('
').map(row=>{let [name,level]=row.split('|').map(v=>(v||'').trim());return name?{name,level:level||''}:null}).filter(Boolean);exp=[...e('f-exp-entries').querySelectorAll('.de')].map(d=>{let i=vals(d),txt=d.querySelector('textarea').value.trim();return {role:i[0]||'',co:i[1]||'',from:i[2]||'',to:i[3]||'',pts:txt}}).filter(x=>x.role||x.co);projects=[...e('f-proj-entries').querySelectorAll('.de')].map(d=>{let i=vals(d),txt=d.querySelector('textarea').value.trim();return {name:i[0]||'',tech:i[1]||'',desc:txt}}).filter(x=>x.name||x.tech);education=[...e('f-edu-entries').querySelectorAll('.de')].map(d=>{let i=vals(d);return {degree:i[0]||'',school:i[1]||'',year:i[2]||''}}).filter(x=>x.degree||x.school);certs=[...e('f-cert-entries').querySelectorAll('.de')].map(d=>{let i=vals(d);return {name:i[0]||'',issuer:i[1]||''}}).filter(x=>x.name||x.issuer);renderCv();closeModal();}
renderCv();
</script></body></html>
